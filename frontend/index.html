<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Denní Jídelníček</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1b4332" />
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-top">
        <span class="app-tag">🍴 GOURMET MENU</span>
        <h1>Denní Jídelníček</h1>
      </div>
      
      <div class="date-nav-bar">
        <button id="btn-prev" class="nav-btn" title="Předchozí den">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        
        <div id="date-label" class="date-display">Načítám datum…</div>
        
        <button id="btn-next" class="nav-btn" title="Následující den">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <button id="btn-today" class="today-chip">📍 Dnes</button>
    </header>

    <main id="menu-list" class="menu-container">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Načítám čerstvé menu…</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
