services:
  # Backend API Služba (Python FastAPI)
  - type: web
    name: jidelna-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app
    envVars:
      - key: JIDELNA_LOGIN
        sync: false
      - key: JIDELNA_HESLO
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend PWA Služba (Statické webové stránky)
  - type: web
    name: jidelna-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
